<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Produtos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>

<main class="container py-4">
    <h1 class="h4 mb-3" th:text="${produto.id == null} ? 'Novo produto' : 'Editar produto'">Novo produto</h1>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{/produtos/salvar}" th:object="${produto}" method="post" novalidate>
                <input type="hidden" th:field="*{id}">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label" for="codigo">Código *</label>
                        <input type="text" id="codigo" class="form-control" th:field="*{codigo}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('codigo')}" th:errors="*{codigo}">Erro</div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="nome">Nome *</label>
                        <input type="text" id="nome" class="form-control" th:field="*{nome}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}">Erro</div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="unidade">Unidade *</label>
                        <input type="text" id="unidade" class="form-control" th:field="*{unidade}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('unidade')}" th:errors="*{unidade}">Erro</div>
                    </div>

                    <div class="col-12">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label" for="precoCusto">Preço de custo</label>
                                <input type="number" step="0.01" id="precoCusto" class="form-control" th:field="*{precoCusto}" th:errorclass="is-invalid">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('precoCusto')}" th:errors="*{precoCusto}">Erro</div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="precoVenda">Preço de venda *</label>
                                <input type="number" step="0.01" id="precoVenda" th:field="*{precoVenda}" class="form-control" required th:errorclass="is-invalid">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('precoVenda')}" th:errors="*{precoVenda}">Erro</div>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label" for="estoqueMinimo">Estoque mínimo *</label>
                        <input type="number" step="1" id="estoqueMinimo" class="form-control" th:field="*{estoqueMinimo}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('estoqueMinimo')}" th:errors="*{estoqueMinimo}">Erro</div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="saldo">Saldo *</label>
                        <input type="number" step="1" id="saldo" class="form-control" th:field="*{saldo}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('saldo')}" th:errors="*{saldo}">Erro</div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label" for="localizacao">Localização</label>
                        <input type="text" id="localizacao" class="form-control" th:field="*{localizacao}" placeholder="ex: Corredor A, Prateleira 2" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('localizacao')}" th:errors="*{localizacao}">Erro</div>
                    </div>
                </div>

                <p class="text-muted small mt-3 mb-0">* Campos obrigatórios</p>

                <div class="mt-3 d-flex gap-2">
                    <button type="submit" class="btn btn-app"><i class="bi bi-check-lg"></i> Salvar</button>
                    <a th:href="@{/produtos}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
