<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Registar Produto')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>

<main class="container py-4" style="max-width: 650px;">
    <h1 class="h3 mb-4" th:text="${produto.id == null ? 'Registar Produto' : 'Editar Produto'}">Produto</h1>

    <div class="card shadow-sm p-4">
        <form th:action="@{/produtos/salvar}" th:object="${produto}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Código</label>
                    <input type="text" th:field="*{codigo}" class="form-control" required>
                </div>
                <div class="col-md-8 mb-3">
                    <label class="form-label">Nome</label>
                    <input type="text" th:field="*{nome}" class="form-control" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Categoria</label>
                <select th:field="*{categoria}" class="form-select" required>
                    <option value="">Selecione a categoria...</option>
                    <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.nome}"></option>
                </select>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Preço de Custo</label>
                    <input type="number" step="0.01" th:field="*{precoCusto}" class="form-control" placeholder="0.00">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Preço de Venda</label>
                    <input type="number" step="0.01" th:field="*{precoVenda}" class="form-control" placeholder="0.00" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Unidade</label>
                    <input type="text" th:field="*{unidade}" class="form-control" placeholder="Ex: UN, KG" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Estoque Mínimo</label>
                    <input type="number" th:field="*{estoqueMinimo}" class="form-control" min="0" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Saldo Inicial</label>
                    <input type="number" th:field="*{saldo}" class="form-control" min="0" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Localização</label>
                <input type="text" th:field="*{localizacao}" class="form-control" placeholder="Ex: Corredor A, Prateleira 2">
            </div>

            <div class="d-flex justify-content-end gap-2">
                <a th:href="@{/produtos}" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-primary">Guardar</button>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
