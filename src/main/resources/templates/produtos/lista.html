<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Produtos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">
            Produtos 
            <span class="badge text-bg-secondary fs-6 align-middle" th:text="${produtos != null ? produtos.size() : 0} + ' registo(s)'">0 registo(s)</span>
        </h1>
        <a th:href="@{/produtos/novo}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i> Novo produto
        </a>
    </div>

    <!-- Tabela de Produtos -->
    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th class="ps-3">Código</th>
                        <th>Nome</th>
                        <th>Categoria</th>
                        <th>Unidade</th>
                        <th>Custo</th>
                        <th>Preço Venda</th>
                        <th>Estoque</th>
                        <th>Mínimo</th>
                        <th>Localização</th>
                        <th class="text-end pe-3" style="width: 180px;">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- A linha inteira fica vermelha (table-danger) se o estoque for menor que o mínimo -->
                    <tr th:each="p : ${produtos}" th:classappend="${p.saldo != null and p.estoqueMinimo != null and p.saldo < p.estoqueMinimo} ? 'table-danger' : ''">
                        <td class="ps-3 fw-semibold" th:text="${p.codigo}">001</td>
                        <td th:text="${p.nome}">Nome</td>
                        <td th:text="${p.categoria != null ? p.categoria.nome : 'Sem Categoria'}">Categoria</td>
                        <td th:text="${p.unidade}">UN</td>
                        <td th:text="${p.precoCusto != null ? 'R$ ' + #numbers.formatDecimal(p.precoCusto, 1, 'COMMA', 2, 'POINT') : 'R$ 0,00'}">R$ 0,00</td>
                        <td th:text="${p.precoVenda != null ? 'R$ ' + #numbers.formatDecimal(p.precoVenda, 1, 'COMMA', 2, 'POINT') : 'R$ 0,00'}">R$ 0,00</td>
                        <td th:text="${p.saldo != null ? p.saldo : 0}">0</td>
                        <td th:text="${p.estoqueMinimo}">0</td>
                        <td th:text="${p.localizacao}">Local</td>
                        <td class="text-end pe-3">
                            <a th:href="@{/produtos/editar/{id}(id=${p.id})}" class="btn btn-sm btn-outline-secondary me-1">
                                <i class="bi bi-pencil"></i> Editar
                            </a>
                            <a th:href="@{/produtos/excluir/{id}(id=${p.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Tem certeza que deseja excluir?')">
                                <i class="bi bi-trash"></i> Excluir
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${produtos == null or produtos.empty}">
                        <td colspan="10" class="text-center py-4 text-muted">Nenhum produto encontrado.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
