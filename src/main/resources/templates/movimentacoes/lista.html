<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Movimentações')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">
            Movimentações 
            <span class="badge text-bg-secondary fs-6 align-middle" th:text="${movimentacoes.size} + ' registo(s)'">0 registo(s)</span>
        </h1>
        <a th:href="@{/movimentacoes/novo}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i> Nova movimentação
        </a>
    </div>

    <!-- Filtro por Tipo de Movimentação (Entrada/Saída) -->
    <form method="get" th:action="@{/movimentacoes}" class="row g-2 mb-4">
        <div class="col-md-4">
            <select name="tipo" class="form-select" onchange="this.form.submit()">
                <option value="">Todos os tipos</option>
                <option value="ENTRADA" th:selected="${param.tipo != null and param.tipo[0] == 'ENTRADA'}">Entrada</option>
                <option value="SAIDA" th:selected="${param.tipo != null and param.tipo[0] == 'SAIDA'}">Saída</option>
            </select>
        </div>
    </form>

    <!-- Tabela de Movimentações -->
    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th class="ps-3">ID</th>
                        <th>Produto</th>
                        <th>Tipo</th>
                        <th>Quantidade</th>
                        <th>Data</th>
                        <th class="text-end pe-3" style="width: 200px;">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="m : ${movimentacoes}">
                        <td class="ps-3 fw-semibold" th:text="${m.id}">1</td>
                        <td th:text="${m.produto != null ? m.produto.nome : 'Produto Removido'}">Nome do Produto</td>
                        <td>
                            <span class="badge" 
                                  th:classappend="${m.tipo.name() == 'ENTRADA'} ? 'text-bg-success' : 'text-bg-warning'" 
                                  th:text="${m.tipo}">ENTRADA</span>
                        </td>
                        <td class="fw-bold" th:text="${m.quantidade}">0</td>
                        <td th:text="${m.data != null ? #temporals.format(m.data, 'dd/MM/yyyy HH:mm') : '-'}">-</td>
                        <td class="text-end pe-3">
                            <a th:href="@{/movimentacoes/editar/{id}(id=${m.id})}" class="btn btn-sm btn-outline-secondary me-1">
                                <i class="bi bi-pencil"></i> Editar
                            </a>
                            <a th:href="@{/movimentacoes/excluir/{id}(id=${m.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Tem certeza que deseja excluir esta movimentação? O saldo do stock será revertido.')">
                                <i class="bi bi-trash"></i> Excluir
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(movimentacoes)}">
                        <td colspan="6" class="text-center py-4 text-muted">Nenhuma movimentação registada.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
