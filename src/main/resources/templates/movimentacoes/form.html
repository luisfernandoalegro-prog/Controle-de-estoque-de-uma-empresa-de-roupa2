<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nova Movimentação')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>

<main class="container py-4">
    <h1 class="h4 mb-3">Registar Movimentação</h1>

    <div th:if="${erro}" class="alert alert-danger" role="alert" th:text="${erro}">Erro</div>

    <form th:action="@{/movimentacoes/salvar}" th:object="${movimentacao}" method="post" class="card p-4 shadow-sm">
        
        <div class="mb-3">
            <label class="form-label">Tipo de Movimentação</label>
            <select th:field="*{tipo}" class="form-select" th:errorclass="is-invalid">
                <option value="">Selecione...</option>
                <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"></option>
            </select>
            <div class="invalid-feedback" th:errors="*{tipo}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Produto</label>
            <select th:field="*{produto}" class="form-select" th:errorclass="is-invalid">
                <option value="">Selecione o produto...</option>
                <option th:each="p : ${produtos}" th:value="${p.id}" th:text="${p.nome}"></option>
            </select>
            <div class="invalid-feedback" th:errors="*{produto}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Quantidade</label>
            <input type="number" th:field="*{quantidade}" class="form-control" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{quantidade}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Observação</label>
            <textarea th:field="*{observacao}" class="form-control" rows="2"></textarea>
        </div>

        <div class="d-flex justify-content-end gap-2">
            <a th:href="@{/movimentacoes}" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary">Guardar</button>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
