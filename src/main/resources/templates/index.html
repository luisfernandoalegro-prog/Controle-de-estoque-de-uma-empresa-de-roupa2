<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Painel Principal')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>

<main class="container py-4">
    <h1 class="h4 mb-4">Painel de Controlo do Estoque</h1>

    <div class="row row-cols-1 row-cols-md-2 row-cols-xl-4 g-4 mb-4">
        <div class="col" th:each="ind : ${indicadores}">
            <div class="card shadow-sm h-100 border-start border-4" th:classappend="'border-' + ${ind.cor}">
                <div class="card-body">
                    <h6 class="text-muted text-uppercase fs-7 mb-1" th:text="${ind.titulo}">Título</h6>
                    <h2 class="fw-bold mb-0" th:text="${ind.valor}">0</h2>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
