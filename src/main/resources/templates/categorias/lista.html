<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Categorias')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">Categorias
            <span class="badge text-bg-secondary align-middle" th:text="${#lists.size(categorias)} + ' registo(s)'">0 registo(s)</span>
        </h1>
        <a th:href="@{/categorias/novo}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Nova categoria</a>
    </div>

    <!-- Formulário de Busca -->
    <form th:action="@{/categorias}" method="get" class="row g-2 mb-3">
        <div class="col-md-5 col-sm-8">
            <input type="text" name="nome" class="form-control" placeholder="Buscar por nome da categoria..." th:value="${termoBusca}">
        </div>
        <div class="col-md-3 col-sm-4 d-flex gap-2">
            <button type="submit" class="btn btn-outline-primary"><i class="bi bi-search"></i> Buscar</button>
            <a th:href="@{/categorias}" class="btn btn-outline-secondary" th:if="${termoBusca != null and !termoBusca.isEmpty()}">Limpar</a>
        </div>
    </form>

    <div th:if="${mensagem}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${mensagem}">Mensagem</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
    </div>

    <div th:if="${#lists.isEmpty(categorias)}" class="alert alert-info">Nenhum registo encontrado.</div>

    <div class="card shadow-sm" th:unless="${#lists.isEmpty(categorias)}">
        <div class="table-responsive">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Nome</th>
                        <th>Descrição</th>
                        <th class="text-end">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="categoria : ${categorias}">
                        <td th:text="${categoria.nome}">Nome</td>
                        <td th:text="${categoria.descricao}">Descrição</td>
                        <td class="text-end text-nowrap">
                            <a th:href="@{/categorias/{id}/editar(id=${categoria.id})}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-pencil"></i> Editar</a>
                            <form th:action="@{/categorias/{id}/excluir(id=${categoria.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Confirma a exclusão deste registo?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i> Excluir</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
